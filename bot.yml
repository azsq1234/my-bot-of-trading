name: Run Telegram Trading Bot

on:
  schedule:
    # يعمل تلقائياً كل 5 دقائق في الخلفية
    - cron: '*/5 * * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بزر واحد

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        run: |
          python bot.py
